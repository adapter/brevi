<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>brevi</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #e8e8ee;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e8e8ee;
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      p {
        margin: 0;
        font-size: 13px;
        color: #8a8a99;
        line-height: 1.5;
      }

      #detail {
        color: #e8e8ee;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      // Everything the page needs travels in the query string; no requests,
      // no external assets, so this renders even with the orchestrator down.
      const params = new URLSearchParams(location.search);
      const state = params.get("state");
      const detail = params.get("detail") || "";
      const app = document.getElementById("app");

      function el(tag, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        return node;
      }

      if (state === "error") {
        const heading = el("h1");
        heading.textContent = "brevi couldn't start the orchestrator";
        const detailText = el("p");
        detailText.id = "detail";
        // Never innerHTML: `detail` is operator-controlled but still untrusted text.
        detailText.textContent = detail;
        const hint = el("p");
        hint.textContent = "Use the tray menu to restart it or view the logs.";
        app.append(heading, detailText, hint);
      } else {
        const dot = el("div", "dot");
        const heading = el("h1");
        heading.textContent = "Starting the orchestrator...";
        app.append(dot, heading);
      }
    </script>
  </body>
</html>
