# Packaging config for `bun run package` (electron-builder), which produces
# distributable macOS/Linux builds under apps/desktop/release. Windows is out
# of scope for this project. Wired into CI: .github/workflows/desktop-release.yml
# runs this once per target (a universal macOS build, an x64 Linux build) when
# the desktop version bumps, and uploads the results to that release; ci.yml
# also runs a Linux-only `--linux dir` packaging smoke check on every PR.
#
# apps/desktop/package.json is the authoritative shipped version.
#
# Packaging never publishes by itself (`--publish never` in every package
# script). Uploading is the workflow's job, with wrangler pushing the update
# feed to R2 and `gh release upload` attaching the artifacts to the release
# that the version bump cut. See the `publish:` block below for why the config
# still declares a publish target even though electron-builder never uses it
# to upload.
appId: dev.brevi.desktop
productName: brevi
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - assets/**
  - package.json
asarUnpack:
  - node_modules/@lydell/node-pty*/**
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    # A single universal artifact rather than one dmg/zip per arch: `arch:
    # [universal]` tells electron-builder to build both an x64 and an arm64
    # app bundle and merge them with `lipo` into one binary.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Required for a download users can actually open: Gatekeeper rejects an
  # unnotarized app, and notarization requires the hardened runtime.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
  # bun installs both @lydell/node-pty darwin platform packages, so the x64 and
  # arm64 app bundles each carry identical copies of both prebuilds and the
  # universal merge refuses to combine them. x64ArchFiles marks them as allowed
  # to be identical across slices; node-pty picks the right one at runtime.
  x64ArchFiles: "**/node_modules/@lydell/node-pty-darwin-*/**"
linux:
  category: Development
  icon: assets/icon.png
  target:
    # AppImage is the primary download (self-contained, auto-updates through
    # the `publish:` feed below). deb and rpm exist for people who would
    # rather their distro's package manager own the install; electron-builder
    # cannot wire auto-update into either format, so an app installed from a
    # .deb or .rpm detects that at runtime (see src/main) and skips update
    # checks instead of offering an update it cannot apply.
    - AppImage
    - deb
    - rpm
# electron-builder still defaults to the *host's* architecture when no `arch:`
# is given at the top level, and that default is what both Linux targets use:
# only the staging host's own build of the native @lydell/node-pty is ever
# installed (see stage-cli.ts), so packaging still happens on a runner
# matching the target arch (desktop-release.yml has an x64 Linux leg; there is
# deliberately no arm64 one yet). macOS is the exception: electron-builder
# installs and merges both native architectures for the universal target.
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
# The update feed electron-updater checks against. Declaring `publish:` makes
# electron-builder write `app-update.yml` into the packaged app itself (this
# URL/provider/channel, baked in so electron-updater knows where to look at
# runtime) and, alongside the artifacts in the output directory, the
# `latest-mac.yml`/`latest-linux.yml` channel files describing them; both are
# produced purely from having this config, independent of whether anything
# actually gets uploaded. Every package script still runs with
# `--publish never`, so electron-builder's own publisher is never invoked to
# upload them. Uploading is the release workflow's job: it pushes the
# artifacts and channel files with wrangler and `gh release upload` into a
# static directory in the public Cloudflare R2 bucket `brevi-downloads`
# (served at downloads.brevi.dev).
publish:
  provider: generic
  url: https://downloads.brevi.dev/desktop/latest
  channel: latest
