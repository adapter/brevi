# Packaging config for `bun run package` (electron-builder), which produces
# distributable macOS/Linux builds under apps/desktop/release. Windows is out
# of scope for this project. Wired into CI:
# .github/workflows/desktop-release.yml runs this once per target OS/arch for
# every `desktop-v*` tag and attaches the results to that tag's GitHub
# release; ci.yml also runs a Linux-only `--linux dir` packaging smoke check
# on every PR.
#
# Packaging never publishes by itself (`--publish never` above). Uploading is
# the workflow's job, with `gh release upload` against the tag that triggered
# it: electron-builder's own GitHub publisher derives the release tag from
# the app version (`v<version>`), which would not match the `desktop-v*` tag
# a release is cut from.
appId: dev.brevi.desktop
productName: brevi
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - assets/**
  - package.json
extraResources:
  # The orchestrator this app supervises (see src/main/paths.ts), staged as
  # a self-contained install (bundled entry + its own node_modules) by
  # scripts/stage-cli.ts, which both packaging scripts run first. Requires
  # `bun run build` at the repo root to have produced packages/cli/dist.
  - from: build/cli
    to: cli
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    - dmg
    - zip
  # Required for a download users can actually open: Gatekeeper rejects an
  # unnotarized app, and notarization requires the hardened runtime.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
linux:
  category: Development
  icon: assets/icon.png
  target:
    - AppImage
    - deb
# No `arch:` list here on purpose. electron-builder defaults to the *host's*
# architecture when none is given, and desktop-release.yml passes an
# explicit --arm64/--x64 flag per matrix leg to make that intent visible.
# Both matter: the staged CLI (build/cli, see scripts/stage-cli.ts) embeds
# whichever platform/arch build of the native @lydell/node-pty the *staging
# host* had installed, so a single run building both arches (e.g. an arm64
# mac cross-building an x64 dmg) would silently ship the wrong native binary
# in one of the two artifacts. Every artifact is staged and packaged on a
# runner matching its own target arch instead (see the release workflow's
# build matrix); there is deliberately no linux/arm64 leg there yet, so this
# config never produces one either.
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
