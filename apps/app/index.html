<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before first paint so there is no flash.
      // Preference: "light" | "dark" | "system" (default system).
      (() => {
        // Mac windows are frameless with inset traffic lights; the CSS pads
        // the sidebar header for them (see index.css).
        document.documentElement.dataset.platform = /mac/i.test(navigator.platform)
          ? "mac"
          : "other";
        const pref = localStorage.getItem("brevi.theme");
        const dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <title>brevi · mission control</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
