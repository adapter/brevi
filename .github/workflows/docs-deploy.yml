# Deploys apps/docs (brevi.dev) to production on release, not on every push
# to main. Docs describing a new feature merge alongside the feature, so a
# continuous deploy would publish them before users can install the release.
# The release signal is the changesets release PR merge bumping
# apps/desktop/package.json, the same path worker-binary.yml and
# desktop-release.yml key their publishes off. A dependency edit touching
# that file also triggers this; the deploy is idempotent, so that is fine.
# CHANGELOG-only pushes do not trigger it. PR preview deploys of the docs
# stay in ci.yml.
#
# workflow_dispatch is the escape hatch for out-of-band docs fixes (typos,
# notices) that should go live without waiting for a release.
#
# Required repository secrets (same names ci.yml documents):
#   CLOUDFLARE_API_TOKEN:  API token with Workers Scripts:Edit (deploys)
#   CLOUDFLARE_ACCOUNT_ID: the Cloudflare account to deploy into
#
# Required repository variables:
#   PUBLIC_POSTHOG_TOKEN: the brevi.dev PostHog project token (publishable),
#     injected into the docs build. Analytics are disabled if unset.
name: Docs deploy

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/package.json
  workflow_dispatch:

# Default to no permissions; the job declares exactly what it needs.
permissions: {}

# One docs deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy production (docs)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read # checkout
    environment:
      name: production
      url: https://brevi.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@brevi/docs
        env:
          PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}

      - name: Deploy docs to production
        working-directory: apps/docs
        run: bun run deploy
