# CI: checks on every push/PR, then Cloudflare deploys. PRs go to the
# preview environment, main goes to production.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN:  API token with Workers Scripts:Edit (deploys)
#   CLOUDFLARE_ACCOUNT_ID: the Cloudflare account to deploy into
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Em dashes read as AI-generated tells; keep them out of tracked files.
      # printf builds the U+2014 character so this file stays free of it.
      - name: Check for em dashes (U+2014)
        run: |
          if git grep -nI "$(printf '\342\200\224')" -- ':!**/CHANGELOG.md'; then
            echo "Em dashes (U+2014) found in the files above. Use a comma, colon, or hyphen instead." >&2
            exit 1
          fi

      - run: bun run lint
      - run: bun run check-types
      - run: bun run build

  deploy-preview:
    name: Deploy preview (docs + api)
    # Uploads per-commit *versions* of the production workers (no traffic
    # shift); each gets its own <version>-<worker>.workers.dev preview URL.
    # Note: preview versions run with the production worker's secrets, which
    # is why this stays same-repo only (forked PRs also have no secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write # upsert the preview-URLs comment
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@brevi/docs

      - name: Deploy docs to preview
        id: docs
        working-directory: apps/docs
        run: |
          set -o pipefail
          bun run deploy:preview 2>&1 | tee /tmp/deploy-docs.log
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/deploy-docs.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Deploy api to preview
        id: api
        working-directory: apps/api
        run: |
          set -o pipefail
          bun run deploy:preview 2>&1 | tee /tmp/deploy-api.log
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/deploy-api.log | tail -1)" >> "$GITHUB_OUTPUT"

      # One sticky comment per PR, updated in place on every push.
      - name: Comment preview URLs on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          API_URL: ${{ steps.api.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- brevi-preview-urls -->"
          # Empty until the worker has preview URLs enabled (applied by the
          # next production deploy after preview_urls lands in the config).
          DOCS_URL="${DOCS_URL:-_pending: preview URLs enable on the next production deploy_}"
          API_URL="${API_URL:-_pending: preview URLs enable on the next production deploy_}"
          body="$(printf '%s\n### Preview deployments\n\n| App | Preview URL (this commit) |\n| --- | --- |\n| docs | %s |\n| api | %s |\n\n_Version preview for %s; production traffic is unaffected._' "$marker" "$DOCS_URL" "$API_URL" "$HEAD_SHA")"
          cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -f body="$body" > /dev/null
            echo "updated comment $cid"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
            echo "created comment"
          fi

  deploy-production:
    name: Deploy production (docs + api)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: production
      url: https://brevi.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@brevi/docs

      - name: Deploy docs to production
        working-directory: apps/docs
        run: bun run deploy

      - name: Deploy api to production
        working-directory: apps/api
        run: bun run deploy
