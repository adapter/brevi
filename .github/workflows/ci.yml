# CI: checks on every push/PR, then Cloudflare deploys. PRs go to the
# preview environment, main goes to production.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN:  API token with Workers Scripts:Edit (deploys)
#   CLOUDFLARE_ACCOUNT_ID: the Cloudflare account to deploy into
#
# Required repository variables:
#   PUBLIC_POSTHOG_TOKEN: the brevi.dev PostHog project token (publishable),
#     injected into the docs build. Analytics are disabled if unset.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to no permissions; each job declares exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset present
    # Every PR must add a changeset (an empty one is fine: bun run changeset
    # --empty). The changesets release PR consumes them instead of adding one,
    # so it is exempt.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a changeset file
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          added="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' | grep -v '^\.changeset/README\.md$' || true)"
          if [ -z "$added" ]; then
            echo "No changeset found. Every PR needs one: run 'bun run changeset' (or 'bun run changeset --empty' when there is nothing to release) and commit the generated .changeset/*.md file." >&2
            exit 1
          fi
          echo "Found changeset(s):"
          echo "$added"

  checks:
    name: Lint, typecheck, build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun, turbo, and electron
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
            ~/.cache/electron
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Em dashes read as AI-generated tells; keep them out of tracked files.
      # printf builds the U+2014 character so this file stays free of it.
      - name: Check for em dashes (U+2014)
        run: |
          if git grep -nI "$(printf '\342\200\224')" -- ':!**/CHANGELOG.md'; then
            echo "Em dashes (U+2014) found in the files above. Use a comma, colon, or hyphen instead." >&2
            exit 1
          fi

      # The host is a pure scheduler: sandboxes are booted by the workers that
      # execute runs, so an import of the provider package here would put
      # execution back in the orchestrator process.
      - name: Check the orchestrator imports no sandbox provider
        run: |
          if git grep -nI 'from "@brevi/sandbox"' -- packages/orchestrator; then
            echo "packages/orchestrator must not import @brevi/sandbox: execution belongs to @brevi/worker." >&2
            exit 1
          fi

      # The installer is POSIX sh on purpose, since it runs under dash (not
      # bash) on Debian and Ubuntu via `curl | sudo sh`. `-n` only parses, it
      # doesn't execute the script.
      - name: Check the shell scripts parse
        run: |
          sh -n packages/worker/scripts/install.sh

      # The installer validates --concurrency itself, so that a value the config
      # schema rejects fails before the machine has been provisioned rather than
      # after. A shell script cannot import the constant, so CI holds the two
      # numbers together.
      - name: Check the installer's concurrency limit matches the config schema
        run: |
          schema=$(sed -n 's/^export const MAX_SANDBOX_CONCURRENCY = \([0-9]*\).*/\1/p' packages/shared/src/config.ts | head -n1)
          installer=$(sed -n 's/^MAX_CONCURRENCY=\([0-9]*\).*/\1/p' packages/worker/scripts/install.sh | head -n1)
          if [ -z "$schema" ] || [ "$schema" != "$installer" ]; then
            echo "MAX_CONCURRENCY in install.sh ('$installer') must match MAX_SANDBOX_CONCURRENCY in packages/shared/src/config.ts ('$schema')." >&2
            exit 1
          fi

      - run: bun run lint
      - run: bun run check-types
      - run: bun run build
      - run: bun test

  desktop-package-smoke:
    name: Desktop packaging smoke check
    # Guards against a regression of "packaged builds cannot load the
    # embedded CLI": packages/cli's build externalizes `open` and the
    # native `@lydell/node-pty`, so apps/desktop/scripts/stage-cli.ts has to
    # copy their resolved node_modules alongside the built CLI before
    # electron-builder bundles it as extraResources, or the packaged app
    # dies with ERR_MODULE_NOT_FOUND before it runs a single line. This job
    # stages the CLI and produces an unpacked (no installer, no publish)
    # Linux build, then asserts the result really is self-contained. Its
    # own job, separate from `checks`, so it doesn't slow that feedback
    # loop down with an electron-builder run.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun, turbo, and electron
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
            ~/.cache/electron
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Stage the CLI
        working-directory: apps/desktop
        run: bun run scripts/stage-cli.ts

      - name: Package (unpacked Linux dir target, no publish)
        working-directory: apps/desktop
        run: bunx electron-builder --linux dir --publish never

      - name: Verify the staged CLI is self-contained
        run: |
          cli_dir=$(find apps/desktop/release -maxdepth 4 -type d -path '*/resources/cli' | head -1)
          if [ -z "$cli_dir" ]; then
            echo "Could not find a resources/cli directory in the packaged output." >&2
            exit 1
          fi
          cli_dir=$(cd "$cli_dir" && pwd)
          echo "Checking $cli_dir"
          test -f "$cli_dir/dist/index.js" || { echo "missing $cli_dir/dist/index.js" >&2; exit 1; }
          test -f "$cli_dir/package.json" || { echo "missing $cli_dir/package.json" >&2; exit 1; }
          test -d "$cli_dir/node_modules/@lydell/node-pty" || { echo "missing $cli_dir/node_modules/@lydell/node-pty" >&2; exit 1; }
          # The staged entry has to load standalone. Copying it out of the
          # checkout first is what makes that real: run in place, a bare
          # `import "@lydell/node-pty"` that only resolves against the
          # workspace's own node_modules further up the tree would still
          # pass, which is exactly the bug this job exists to catch.
          isolated=$(mktemp -d)
          cp -R "$cli_dir/." "$isolated/"
          version=$(cd "$isolated" && node dist/index.js --version)
          echo "isolated CLI reports version $version"
          case "$version" in
            0.0.0|"") echo "staged CLI could not read its own package.json" >&2; exit 1 ;;
          esac
          rm -rf "$isolated"
          echo "desktop packaging smoke check passed"

      - name: Verify the update feed is baked in
        run: |
          # app-update.yml is what tells an installed app where to look for
          # updates (provider and feed URL, baked in by electron-builder
          # from the `publish:` block in electron-builder.yml). Losing it,
          # e.g. a config regression that drops `publish:`, would silently
          # disable auto-update for every install: the app would just never
          # check, with no error anywhere.
          update_yml=$(find apps/desktop/release -maxdepth 4 -type f -path '*/resources/app-update.yml' | head -1)
          if [ -z "$update_yml" ]; then
            echo "Could not find a resources/app-update.yml in the packaged output." >&2
            exit 1
          fi
          echo "Checking $update_yml"
          cat "$update_yml"
          grep -q '^provider: generic' "$update_yml" || { echo "app-update.yml does not declare the generic provider" >&2; exit 1; }
          grep -q 'downloads\.brevi\.dev' "$update_yml" || { echo "app-update.yml does not point at downloads.brevi.dev" >&2; exit 1; }
          echo "update feed baked in correctly"

  deploy-preview:
    name: Deploy preview (docs + api)
    # Uploads per-commit *versions* of the production workers (no traffic
    # shift); each gets its own <version>-<worker>.workers.dev preview URL.
    # Note: preview versions run with the production worker's secrets, which
    # is why this stays same-repo only (forked PRs also have no secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write # upsert the preview-URLs comment
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@brevi/docs
        env:
          PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}

      - name: Deploy docs to preview
        id: docs
        working-directory: apps/docs
        run: |
          set -o pipefail
          bun run deploy:preview 2>&1 | tee /tmp/deploy-docs.log
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/deploy-docs.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Deploy api to preview
        id: api
        working-directory: apps/api
        run: |
          set -o pipefail
          bun run deploy:preview 2>&1 | tee /tmp/deploy-api.log
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/deploy-api.log | tail -1)" >> "$GITHUB_OUTPUT"

      # One sticky comment per PR, updated in place on every push.
      - name: Comment preview URLs on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          API_URL: ${{ steps.api.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- brevi-preview-urls -->"
          # Empty until the worker has preview URLs enabled (applied by the
          # next production deploy after preview_urls lands in the config).
          DOCS_URL="${DOCS_URL:-_pending: preview URLs enable on the next production deploy_}"
          API_URL="${API_URL:-_pending: preview URLs enable on the next production deploy_}"
          body="$(printf '%s\n### Preview deployments\n\n| App | Preview URL (this commit) |\n| --- | --- |\n| docs | %s |\n| api | %s |\n\n_Version preview for %s; production traffic is unaffected._' "$marker" "$DOCS_URL" "$API_URL" "$HEAD_SHA")"
          cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -f body="$body" > /dev/null
            echo "updated comment $cid"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
            echo "created comment"
          fi

  deploy-production:
    name: Deploy production (docs + api)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read # checkout
    environment:
      name: production
      url: https://brevi.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun and turbo
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@brevi/docs
        env:
          PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}

      - name: Deploy docs to production
        working-directory: apps/docs
        run: bun run deploy

      - name: Deploy api to production
        working-directory: apps/api
        run: bun run deploy
