# Releases the npm packages (@brevi/cli, orchestrator, sandbox, shared, app)
# via Changesets: pushes to main with pending changesets open (or update) a
# "Release packages" PR; merging that PR publishes to npm with provenance.
#
# Required repository secrets:
#   NPM_TOKEN — npm automation token with publish rights to the @brevi scope
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version branch / tags
  pull-requests: write # open the Release packages PR
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Version or publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          commit: "Release packages"
          title: "Release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
