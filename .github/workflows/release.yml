# Releases the npm packages (@brevi/cli, orchestrator, sandbox, shared, app)
# via Changesets: pushes to main with pending changesets open (or update) a
# "Release packages" PR; merging that PR publishes to npm.
#
# Required repository secrets:
#   NPM_TOKEN — npm automation token with publish rights to the @brevi scope
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          commit: "Release packages"
          title: "Release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
