# Releases the npm packages (@brevi/cli, orchestrator, sandbox, shared, app)
# via Changesets + npm staged publishing: pushes to main with pending
# changesets open (or update) a "Release packages" PR; merging that PR
# *stages* the new versions on npm (no OTP needed), and a maintainer
# approves them with 2FA on npmjs.com → Staged Packages.
#
# Released @brevi/cli versions are also mirrored to GitHub Packages as
# @adapter/brevi-cli (GitHub requires the npm scope to match the repo owner)
# so they appear in the repo's Packages sidebar; registry.npmjs.org remains
# the canonical install source.
#
# Required repository secrets:
#   NPM_TOKEN — npm token with publish rights to the @brevi scope
#               (staging needs no 2FA bypass)
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version branch / tags
  pull-requests: write # open the Release packages PR
  id-token: write # npm provenance attestation
  packages: write # mirror @brevi/cli to GitHub Packages

jobs:
  release:
    name: Version or publish
    # GitHub-hosted on purpose: npm rejects provenance attestations from
    # self-hosted runners (Blacksmith counts as self-hosted in OIDC claims).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Staged publishing needs npm >= 11.15, newer than Node 24's bundled
      # npm. Pinned exactly — this binary handles NPM_TOKEN, so it must not
      # float to whatever the registry serves as latest. Dependabot won't see
      # this; bump it deliberately.
      - run: npm install -g npm@11.19.0

      - run: bun install --frozen-lockfile

      - name: Create release PR or stage publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          commit: "Release packages"
          title: "Release packages"
          # Versions are only staged here; nothing is live until approval.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Mirror the latest npm release of @brevi/cli to GitHub Packages (as
      # @adapter/brevi-cli) so the repo's Packages sidebar lists it. The
      # released tarball is re-published as-is — nothing is rebuilt — and a
      # staged version is invisible until approved, so this is a no-op on
      # most pushes and only fires once a new release is live on npm.
      - name: Mirror to GitHub Packages
        run: bun scripts/publish-github-packages.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
