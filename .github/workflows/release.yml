# Releases the npm packages (@brevi/cli, orchestrator, sandbox, shared, app)
# via Changesets + npm staged publishing: pushes to main with pending
# changesets open (or update) a "Release packages" PR; merging that PR
# *stages* the new versions on npm (no OTP needed), and a maintainer
# approves them with 2FA on npmjs.com → Staged Packages.
#
# Staging requires the package to already exist on the registry — the
# first-ever publish happens locally via `bun run release:first`.
#
# Required repository secrets:
#   NPM_TOKEN — npm token with publish rights to the @brevi scope
#               (staging needs no 2FA bypass)
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version branch / tags
  pull-requests: write # open the Release packages PR
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Version or publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Staged publishing needs npm >= 11.15, newer than Node 24's bundled
      # npm. Pinned exactly — this binary handles NPM_TOKEN, so it must not
      # float to whatever the registry serves as latest. Dependabot won't see
      # this; bump it deliberately.
      - run: npm install -g npm@11.19.0

      - run: bun install --frozen-lockfile

      - name: Create release PR or stage publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          commit: "Release packages"
          title: "Release packages"
          # Versions are only staged here; nothing is live until approval.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
